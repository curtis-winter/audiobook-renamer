services:
  audiobook-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audiobook-manager
    ports:
      - "8080:80"
    volumes:
      # General media mount - /mnt/plex-media on host is available as /mnt/media in container
      - /mnt/plex-media:/mnt/media
      - ./config:/config
    environment:
      - PYTHONUNBUFFERED=1
      - AUDIBLE_AUTH_FILE=/config/auth.json
    restart: unless-stopped
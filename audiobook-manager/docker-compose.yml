version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: audiobook-manager-backend
    ports:
      - "8000:8000"
    volumes:
      # General media mount - /mnt/plex-media on host is available as /mnt/media in container
      - /mnt/plex-media:/mnt/media
      - ${CONFIG_FOLDER:-./data/config}:/config
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: audiobook-manager-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  watch:
  output:
  config:
services:
  audiobook-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audiobook-manager
    ports:
      - "8081:80"
    volumes:
      # CHANGE THIS PATH to your audiobook library location on the host
      - /mnt/plex-media:/mnt/media
      - audiobook-config:/config
    environment:
      - PYTHONUNBUFFERED=1
      - CONFIG_PATH=/config/config.json
      - ALLOWED_ORIGINS=*
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  audiobook-config: